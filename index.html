<!DOCTYPE>
<html>
<head>
  <title>丹娜的网站</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="water_bg" id="water_bg">
    <img src="images/petal.png" class="petal" style="left: 10%; animation-delay: 0s;">
    <img src="images/petal.png" class="petal" style="left: 25%; animation-delay: 2s;">
    <img src="images/petal.png" class="petal" style="left: 40%; animation-delay: 1s;">
    <img src="images/petal.png" class="petal" style="left: 55%; animation-delay: 3s;">
    <img src="images/petal.png" class="petal" style="left: 70%; animation-delay: 0.5s;">
    <img src="images/petal.png" class="petal" style="left: 85%; animation-delay: 2.5s;">
    <img src="images/petal.png" class="petal" style="left: 95%; animation-delay: 1.5s;">
  </div>
  <img src="images/grass_bg.png" class="grass" alt="草">
  
  <div id="petal_container"></div>
  
  <div class="stage">
    <img src="images/um.png" class="interactive_item" id="umbrella" alt="伞" style="top:10%;left:50%;width:300px;z-index:10;">
   <img src="images/girl.png" class="interactive_item" id="girl" alt="女孩" style="top:30%;left:50%;width:500px;transform: translateX(-50%); z-index: 20;">
   <img src="images/sho.png" class="interactive_item" id="shoes" alt="鞋" style="top:75%;left:20%;width:200px;z-index:30">
  </div>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery.ripples@0.6.3/dist/jquery.ripples.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
